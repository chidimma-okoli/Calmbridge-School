name: Calmbridge Backend CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  test-and-security:
    name: Test and Security Checks
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout repository
      # ==========================================
      - name: Checkout code
        uses: actions/checkout@v4


      # ==========================================
      # 2. Set up Python
      # ==========================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip


      # ==========================================
      # 3. Check Python and pip
      # ==========================================
      - name: Check Python and pip
        run: |
          python --version
          python -m pip --version


      # ==========================================
      # 4. Install dependencies
      # ==========================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ==========================================
      # 5. Check Python syntax
      # ==========================================
      - name: Check Python syntax
        run: |
          python -m compileall .


      # ==========================================
      # 6. Run tests
      # ==========================================
      - name: Run tests
        run: |
          if [ -d "tests" ]; then
            pytest
          else
            echo "No tests directory found. Skipping pytest."
          fi


      # ==========================================
      # 7. Check dependency vulnerabilities
      # ==========================================
      - name: Python dependency security audit
        run: |
          pip install pip-audit
          pip-audit
        continue-on-error: true


      # ==========================================
      # 8. Build Docker image
      # ==========================================
      - name: Build Docker image
        run: |
          docker build \
            --tag calmbridge-backend:${{ github.sha }} \
            .


      # ==========================================
      # 9. Install Trivy
      # ==========================================
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.3


      # ==========================================
      # 10. Scan backend filesystem
      # ==========================================
      - name: Trivy filesystem scan
        run: |
          trivy fs \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            .


      # ==========================================
      # 11. Scan backend Docker image
      # ==========================================
      - name: Trivy Docker image scan
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            calmbridge-backend:${{ github.sha }}