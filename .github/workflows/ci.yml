name: Calmbridge CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

# ---------------------------------------------------------
# Workflow permissions
# ---------------------------------------------------------
permissions:
  contents: read
  packages: write


jobs:

  # =========================================================
  # BACKEND
  # =========================================================
  backend:
    name: Backend - Test
    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------------------
      # 1. Checkout repository
      # -----------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4


      # -----------------------------------------------------
      # 2. Set up Python
      # -----------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt


      # -----------------------------------------------------
      # 3. Check Python version
      # -----------------------------------------------------
      - name: Check Python
        run: |
          python --version
          python -m pip --version


      # -----------------------------------------------------
      # 4. Install backend dependencies
      # -----------------------------------------------------
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # -----------------------------------------------------
      # 5. Check Python syntax
      # -----------------------------------------------------
      - name: Check backend syntax
        working-directory: backend
        run: |
          python -m compileall .


  # =========================================================
  # FRONTEND
  # =========================================================
  frontend:
    name: Frontend - Build
    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------------------
      # 1. Checkout repository
      # -----------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4


      # -----------------------------------------------------
      # 2. Set up Node.js 22
      # -----------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json


      # -----------------------------------------------------
      # 3. Check Node and npm
      # -----------------------------------------------------
      - name: Check Node.js and npm
        run: |
          node --version
          npm --version


      # -----------------------------------------------------
      # 4. Install frontend dependencies
      # -----------------------------------------------------
      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci


      # -----------------------------------------------------
      # 5. Lint frontend
      # -----------------------------------------------------
      - name: Lint frontend
        working-directory: frontend
        run: |
          npm run lint


      # -----------------------------------------------------
      # 6. TypeScript check
      # -----------------------------------------------------
      - name: TypeScript check
        working-directory: frontend
        run: |
          npx tsc --noEmit


      # -----------------------------------------------------
      # 7. Build Next.js application
      # -----------------------------------------------------
      - name: Build Next.js application
        working-directory: frontend
        run: |
          npm run build


  # =========================================================
  # DOCKER BUILD
  # =========================================================
  docker:
    name: Docker - Build
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:

      # -----------------------------------------------------
      # 1. Checkout repository
      # -----------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4


      # -----------------------------------------------------
      # 2. Check Docker
      # -----------------------------------------------------
      - name: Check Docker
        run: |
          docker --version
          docker compose version


      # -----------------------------------------------------
      # 3. Validate Docker Compose
      # -----------------------------------------------------
      - name: Validate Docker Compose
        run: |
          docker compose config


      # -----------------------------------------------------
      # 4. Build backend Docker image
      # -----------------------------------------------------
      - name: Build backend Docker image
        run: |
          docker build \
            --tag calmbridge-backend:scan \
            ./backend


      # -----------------------------------------------------
      # 5. Build frontend Docker image
      # -----------------------------------------------------
      - name: Build frontend Docker image
        run: |
          docker build \
            --tag calmbridge-frontend:scan \
            ./frontend


      # -----------------------------------------------------
      # 6. Display Docker images
      # -----------------------------------------------------
      - name: Display Docker images
        run: |
          docker images


  # =========================================================
  # SECURITY SCAN
  # =========================================================
  security:
    name: Security - Trivy Scan
    runs-on: ubuntu-latest

    needs:
      - docker

    steps:

      # -----------------------------------------------------
      # 1. Checkout repository
      # -----------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4


      # -----------------------------------------------------
      # 2. Build backend image for Trivy
      # -----------------------------------------------------
      - name: Build backend image
        run: |
          docker build \
            --tag calmbridge-backend:scan \
            ./backend


      # -----------------------------------------------------
      # 3. Build frontend image for Trivy
      # -----------------------------------------------------
      - name: Build frontend image
        run: |
          docker build \
            --tag calmbridge-frontend:scan \
            ./frontend


      # -----------------------------------------------------
      # 4. Scan backend image
      # -----------------------------------------------------
      - name: Trivy scan - Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "calmbridge-backend:scan"
          format: "table"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "0"


      # -----------------------------------------------------
      # 5. Scan frontend image
      # -----------------------------------------------------
      - name: Trivy scan - Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "calmbridge-frontend:scan"
          format: "table"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "0"


  # =========================================================
  # PUBLISH IMAGES TO GHCR
  # =========================================================
  publish:
    name: Publish Images - GHCR
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend
      - docker
      - security

    # Only publish when code is pushed to main.
    # Pull requests and develop pushes will not publish.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:

      # -----------------------------------------------------
      # 1. Checkout repository
      # -----------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4


      # -----------------------------------------------------
      # 2. Log in to GitHub Container Registry
      # -----------------------------------------------------
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # -----------------------------------------------------
      # 3. Build backend image
      # -----------------------------------------------------
      - name: Build backend image
        run: |
          docker build \
            --tag ghcr.io/${{ github.repository_owner }}/calmbridge-backend:${{ github.sha }} \
            --tag ghcr.io/${{ github.repository_owner }}/calmbridge-backend:latest \
            ./backend


      # -----------------------------------------------------
      # 4. Build frontend image
      # -----------------------------------------------------
      - name: Build frontend image
        run: |
          docker build \
            --tag ghcr.io/${{ github.repository_owner }}/calmbridge-frontend:${{ github.sha }} \
            --tag ghcr.io/${{ github.repository_owner }}/calmbridge-frontend:latest \
            ./frontend


      # -----------------------------------------------------
      # 5. Push backend image
      # -----------------------------------------------------
      - name: Push backend image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/calmbridge-backend:${{ github.sha }}

          docker push \
            ghcr.io/${{ github.repository_owner }}/calmbridge-backend:latest


      # -----------------------------------------------------
      # 6. Push frontend image
      # -----------------------------------------------------
      - name: Push frontend image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/calmbridge-frontend:${{ github.sha }}

          docker push \
            ghcr.io/${{ github.repository_owner }}/calmbridge-frontend:latest


      # -----------------------------------------------------
      # 7. Publish summary
      # -----------------------------------------------------
      - name: Publish summary
        run: |
          echo "=========================================="
          echo "      CALMBRIDGE IMAGES PUBLISHED"
          echo "=========================================="
          echo ""
          echo "Backend image:"
          echo "ghcr.io/${{ github.repository_owner }}/calmbridge-backend:${{ github.sha }}"
          echo ""
          echo "Frontend image:"
          echo "ghcr.io/${{ github.repository_owner }}/calmbridge-frontend:${{ github.sha }}"
          echo ""
          echo "Both images were also tagged as latest."