name: Calmbridge CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

# Minimum permissions for the workflow
permissions:
  contents: read
  packages: write


jobs:

  # =========================================================
  # BACKEND
  # =========================================================
  backend:
    name: Backend - Test
    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------
      # 1. Checkout code
      # -----------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4


      # -----------------------------------------
      # 2. Set up Python
      # -----------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt


      # -----------------------------------------
      # 3. Check Python and pip
      # -----------------------------------------
      - name: Check Python and pip
        run: |
          python --version
          python -m pip --version


      # -----------------------------------------
      # 4. Install backend dependencies
      # -----------------------------------------
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # -----------------------------------------
      # 5. Check backend syntax
      # -----------------------------------------
      - name: Check backend syntax
        working-directory: backend
        run: |
          python -m compileall .


  # =========================================================
  # FRONTEND
  # =========================================================
  frontend:
    name: Frontend - Build
    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------
      # 1. Checkout code
      # -----------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4


      # -----------------------------------------
      # 2. Set up Node.js 22
      # -----------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json


      # -----------------------------------------
      # 3. Check Node and npm
      # -----------------------------------------
      - name: Check Node.js and npm
        run: |
          node --version
          npm --version


      # -----------------------------------------
      # 4. Install frontend dependencies
      # -----------------------------------------
      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci


      # -----------------------------------------
      # 5. Lint frontend
      # -----------------------------------------
      - name: Lint frontend
        working-directory: frontend
        run: |
          npm run lint


      # -----------------------------------------
      # 6. TypeScript check
      # -----------------------------------------
      - name: TypeScript check
        working-directory: frontend
        run: |
          npx tsc --noEmit


      # -----------------------------------------
      # 7. Build Next.js application
      # -----------------------------------------
      - name: Build Next.js application
        working-directory: frontend
        run: |
          npm run build


  # =========================================================
  # DOCKER
  # =========================================================
  docker:
    name: Docker - Build
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:

      # -----------------------------------------
      # 1. Checkout code
      # -----------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4


      # -----------------------------------------
      # 2. Check Docker
      # -----------------------------------------
      - name: Check Docker
        run: |
          docker --version
          docker compose version


      # -----------------------------------------
      # 3. Validate Docker Compose
      # -----------------------------------------
      - name: Validate Docker Compose
        run: |
          docker compose config


      # -----------------------------------------
      # 4. Build backend image
      # -----------------------------------------
      - name: Build backend Docker image
        run: |
          docker build \
            --tag calmbridge-backend:scan \
            ./backend


      # -----------------------------------------
      # 5. Build frontend image
      # -----------------------------------------
      - name: Build frontend Docker image
        run: |
          docker build \
            --tag calmbridge-frontend:scan \
            ./frontend


      # -----------------------------------------
      # 6. Show Docker images
      # -----------------------------------------
      - name: Show Docker images
        run: |
          docker images


  # =========================================================
  # SECURITY
  # =========================================================
  security:
    name: Security - Container Scan
    runs-on: ubuntu-latest

    needs:
      - docker

    steps:

      # -----------------------------------------
      # 1. Checkout code
      # -----------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4


      # -----------------------------------------
      # 2. Build backend image for scanning
      # -----------------------------------------
      - name: Build backend image
        run: |
          docker build \
            --tag calmbridge-backend:scan \
            ./backend


      # -----------------------------------------
      # 3. Build frontend image for scanning
      # -----------------------------------------
      - name: Build frontend image
        run: |
          docker build \
            --tag calmbridge-frontend:scan \
            ./frontend


      # -----------------------------------------
      # 4. Install Trivy
      # -----------------------------------------
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.3


      # -----------------------------------------
      # 5. Trivy filesystem scan
      # -----------------------------------------
      - name: Trivy filesystem scan
        run: |
          trivy fs \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            .


      # -----------------------------------------
      # 6. Scan backend Docker image
      # -----------------------------------------
      - name: Scan backend image
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            calmbridge-backend:scan


      # -----------------------------------------
      # 7. Scan frontend Docker image
      # -----------------------------------------
      - name: Scan frontend image
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            calmbridge-frontend:scan


  # =========================================================
  # PUBLISH TO GITHUB CONTAINER REGISTRY
  # =========================================================
  publish:
    name: Publish Images - GHCR
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend
      - docker
      - security

    # Publish only when code is pushed to main.
    # Pull requests and develop pushes will not publish images.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:

      # -----------------------------------------
      # 1. Checkout code
      # -----------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4


      # -----------------------------------------
      # 2. Log in to GitHub Container Registry
      # -----------------------------------------
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # -----------------------------------------
      # 3. Build backend image
      # -----------------------------------------
      - name: Build backend image
        run: |
          docker build \
            --tag ghcr.io/${{ github.repository_owner }}/calmbridge-backend:${{ github.sha }} \
            --tag ghcr.io/${{ github.repository_owner }}/calmbridge-backend:latest \
            ./backend


      # -----------------------------------------
      # 4. Build frontend image
      # -----------------------------------------
      - name: Build frontend image
        run: |
          docker build \
            --tag ghcr.io/${{ github.repository_owner }}/calmbridge-frontend:${{ github.sha }} \
            --tag ghcr.io/${{ github.repository_owner }}/calmbridge-frontend:latest \
            ./frontend


      # -----------------------------------------
      # 5. Push backend image
      # -----------------------------------------
      - name: Push backend image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/calmbridge-backend:${{ github.sha }}

          docker push \
            ghcr.io/${{ github.repository_owner }}/calmbridge-backend:latest


      # -----------------------------------------
      # 6. Push frontend image
      # -----------------------------------------
      - name: Push frontend image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/calmbridge-frontend:${{ github.sha }}

          docker push \
            ghcr.io/${{ github.repository_owner }}/calmbridge-frontend:latest


      # -----------------------------------------
      # 7. Deployment summary
      # -----------------------------------------
      - name: Deployment images summary
        run: |
          echo "======================================"
          echo "Calmbridge images published to GHCR"
          echo "======================================"
          echo ""
          echo "Backend:"
          echo "ghcr.io/${{ github.repository_owner }}/calmbridge-backend:${{ github.sha }}"
          echo ""
          echo "Frontend:"
          echo "ghcr.io/${{ github.repository_owner }}/calmbridge-frontend:${{ github.sha }}"
          echo ""
          echo "Images tagged as latest:"
          echo "calmbridge-backend:latest"
          echo "calmbridge-frontend:latest"