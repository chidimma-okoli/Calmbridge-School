name: Calmbridge School CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  backend:
    name: Backend - Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check backend
        working-directory: backend
        run: |
          python -m compileall .


  frontend:
    name: Frontend - Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: frontend
        run: npm run build


  docker:
    name: Docker - Build
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: |
          docker build \
            -f backend/dockerfile \
            -t calmbridge-backend:ci \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            -f frontend/dockerfile \
            -t calmbridge-frontend:ci \
            ./frontend

      - name: Check Docker Compose configuration
        run: docker compose config


  security:
    name: Security - Container Scan
    runs-on: ubuntu-latest

    needs:
      - docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: |
          docker build \
            -f backend/dockerfile \
            -t calmbridge-backend:scan \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            -f frontend/dockerfile \
            -t calmbridge-frontend:scan \
            ./frontend

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg

          wget -qO- https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo gpg --dearmor \
            -o /usr/share/keyrings/trivy.gpg

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan backend image
        run: |
          trivy image \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --exit-code 1 \
          calmbridge-backend:scan

      - name: Scan frontend image
        run: |
         trivy image \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --exit-code 1 \
          calmbridge-frontend:scan


  publish:
    name: Publish Images - GHCR
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend
      - docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/calmbridge-backend:latest
            ghcr.io/${{ github.repository_owner }}/calmbridge-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/calmbridge-frontend:latest
            ghcr.io/${{ github.repository_owner }}/calmbridge-frontend:${{ github.sha }}