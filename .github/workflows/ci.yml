name: Calmbridge Frontend CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

# Minimum permissions required by this workflow
permissions:
  contents: read

jobs:
  build-and-security:
    name: Build and Security Checks
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout repository
      # ==========================================
      - name: Checkout code
        uses: actions/checkout@v4


      # ==========================================
      # 2. Set up Node.js 22
      # ==========================================
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm


      # ==========================================
      # 3. Verify Node and npm
      # ==========================================
      - name: Check Node.js and npm
        run: |
          node --version
          npm --version


      # ==========================================
      # 4. Install dependencies
      # ==========================================
      - name: Install dependencies
        run: npm ci


      # ==========================================
      # 5. Check dependency vulnerabilities
      # ==========================================
      - name: npm security audit
        run: npm audit --audit-level=high
        continue-on-error: true


      # ==========================================
      # 6. Build Next.js application
      # ==========================================
      - name: Build Next.js application
        run: npm run build


      # ==========================================
      # 7. Build Docker image
      # ==========================================
      - name: Build Docker image
        run: |
          docker build \
            --tag calmbridge-frontend:${{ github.sha }} \
            .


      # ==========================================
      # 8. Install Trivy
      # ==========================================
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.3


      # ==========================================
      # 9. Scan source files
      # ==========================================
      - name: Trivy filesystem scan
        run: |
          trivy fs \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            .


      # ==========================================
      # 10. Scan Docker image
      # ==========================================
      - name: Trivy Docker image scan
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            calmbridge-frontend:${{ github.sha }}