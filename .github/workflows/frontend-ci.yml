name: Calmbridge Frontend CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

# Minimum permissions required
permissions:
  contents: read

jobs:
  frontend-ci:
    name: Frontend Build and Security
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout repository
      # ==========================================
      - name: Checkout code
        uses: actions/checkout@v4


      # ==========================================
      # 2. Set up Node.js
      # ==========================================
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json


      # ==========================================
      # 3. Check Node.js and npm
      # ==========================================
      - name: Check Node.js and npm
        run: |
          node --version
          npm --version


      # ==========================================
      # 4. Install dependencies
      # ==========================================
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci


      # ==========================================
      # 5. npm security audit
      # ==========================================
      - name: npm security audit
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true


      # ==========================================
      # 6. Build Next.js application
      # ==========================================
      - name: Build Next.js application
        working-directory: frontend
        run: npm run build


      # ==========================================
      # 7. Build frontend Docker image
      # ==========================================
      - name: Build frontend Docker image
        working-directory: frontend
        run: docker build -t calmbridge-frontend:${{ github.sha }} .


      # ==========================================
      # 8. Trivy filesystem scan
      # ==========================================
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: frontend
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0


      # ==========================================
      # 9. Trivy Docker image scan
      # ==========================================
      - name: Trivy frontend Docker image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          scan-ref: calmbridge-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0