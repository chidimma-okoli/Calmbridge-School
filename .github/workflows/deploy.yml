# Calmbridge School CD pipeline
name: Deploy Calmbridge School

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/Calmbridge-School

            echo "Pulling latest code..."
            git pull origin main

            echo "Rebuilding Calmbridge containers..."
            docker compose up -d --build

            echo "Deployment complete."

            echo "Running containers:"
            docker compose ps
